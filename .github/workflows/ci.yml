name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: php artisan test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make up
      - run: curl -kfsS https://localhost:8443/up
      - run: curl -fsS -o /dev/null http://localhost:8025
      - if: failure()
        run: docker compose logs

  new-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialise as a new project
        run: make init NAME=demo-app VENDOR=acme
      - run: grep -qx 'APP_NAME=demo-app' .env.example
      - run: grep -q 'acme/demo-app' composer.json
      - run: make up
      - run: curl -kfsS https://localhost:8443/ | grep -q '<title>demo-app</title>'
      - run: make test

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production environment
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
      - run: docker compose -f compose.prod.yaml up -d --build --wait
      - run: curl -fsS http://localhost:8080/up
      - run: curl -fsS http://localhost:8080/ | grep -q '/build/assets/'
      - if: failure()
        run: docker compose -f compose.prod.yaml logs
