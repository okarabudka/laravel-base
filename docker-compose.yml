x-project: &project .:/var/www

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - ${HTTP_PORT:-8080}:80
      - ${HTTPS_PORT:-8443}:443
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - .:/var/www:ro
      - ./docker/conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/conf/ssl:/etc/nginx/ssl:ro
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - *project
    depends_on:
      - mail
    restart: unless-stopped

  node:
    image: node:22-alpine
    profiles: [dev]
    user: ${UID:-1000}:${GID:-1000}
    working_dir: /var/www
    command: sh -c "npm ci --ignore-scripts && npm run dev"
    environment:
      npm_config_cache: /tmp/npm
    ports:
      - 5173:5173
    volumes:
      - *project

  mail:
    image: axllent/mailpit:v1.33
    ports:
      - ${MAILPIT_PORT:-8025}:8025
    restart: unless-stopped

  db:
    image: mariadb:11.4
    profiles: [full]
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-laravel}
      MARIADB_USER: ${DB_USERNAME:-laravel}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/conf/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: [full]
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
